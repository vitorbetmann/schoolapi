AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SchoolAPI - serverless course feedback platform (FIAP ADJT Phase 4 Tech Challenge)

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedPattern: "[a-z0-9]+"
    Description: API Gateway stage name.
  AdminEmail:
    Type: String
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
    ConstraintDescription: must be a valid email address.
    Description: Administrator email that receives critical-feedback notices (must confirm the SNS subscription).
  LambdaRoleArn:
    Type: String
    Default: ""
    Description: Optional existing role for every function (AWS Academy Learner Lab). Leave empty to create least-privilege roles.

Conditions:
  UseLabRole: !Not [!Equals [!Ref LambdaRoleArn, ""]]
  CreateRoles: !Equals [!Ref LambdaRoleArn, ""]

Globals:
  Function:
    Runtime: java21
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 15
    PropagateTags: true
    Tags:
      Project: schoolapi
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: schoolapi
        POWERTOOLS_LOG_LEVEL: INFO
        POWERTOOLS_METRICS_NAMESPACE: SchoolAPI

Resources:
  FeedbackKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts SchoolAPI data at rest (DynamoDB, logs, SNS, S3).
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
          - Sid: AllowCloudWatchAlarmsToPublishToEncryptedTopic
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
      Tags:
        - Key: Project
          Value: schoolapi

  FeedbackKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}
      TargetKeyId: !Ref FeedbackKey

  FeedbacksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-feedbacks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: day
          AttributeType: S
        - AttributeName: submittedAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-day
          KeySchema:
            - AttributeName: day
              KeyType: HASH
            - AttributeName: submittedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref FeedbackKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      Tags:
        - Key: Project
          Value: schoolapi

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
      Tags:
        - Key: Project
          Value: schoolapi

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !If [UseLabRole, !Ref LambdaRoleArn, !GetAtt ApiGatewayCloudWatchRole.Arn]

  FeedbackApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-access
      RetentionInDays: 14
      KmsKeyId: !GetAtt FeedbackKey.Arn
      Tags:
        - Key: Project
          Value: schoolapi

  FeedbackApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      Name: !Sub ${AWS::StackName}-api
      StageName: !Ref Stage
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          Description: Throttling and daily quota for student submissions.
          Throttle:
            RateLimit: 10
            BurstLimit: 20
          Quota:
            Limit: 5000
            Period: DAY
      AccessLogSetting:
        DestinationArn: !GetAtt FeedbackApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.resourcePath","status":"$context.status","latencyMs":"$context.responseLatency","apiKeyId":"$context.identity.apiKeyId","error":"$context.error.message"}'
      Models:
        SubmitFeedbackRequest:
          type: object
          required:
            - descricao
            - nota
          additionalProperties: false
          properties:
            descricao:
              type: string
              minLength: 1
              maxLength: 1000
              pattern: \S
            nota:
              type: integer
              minimum: 0
              maximum: 10
      GatewayResponses:
        BAD_REQUEST_BODY:
          StatusCode: 400
          ResponseParameters:
            Headers:
              Content-Type: "'application/problem+json'"
          ResponseTemplates:
            application/json: '{"errors": ["$context.error.validationErrorString"]}'
      Tags:
        Project: schoolapi

  SubmitFeedbackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-submit-feedback
      RetentionInDays: 14
      KmsKeyId: !GetAtt FeedbackKey.Arn
      Tags:
        - Key: Project
          Value: schoolapi

  SubmitFeedbackFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: True
    Properties:
      FunctionName: !Sub ${AWS::StackName}-submit-feedback
      Description: Validates, classifies and stores a course feedback (POST /avaliacao).
      CodeUri: ../functions/submit-feedback/target/submit-feedback-1.0.0-SNAPSHOT.jar
      Handler: com.vitorbetmann.schoolapi.infrastructure.SubmitFeedbackHandler::handleRequest
      Role: !If [UseLabRole, !Ref LambdaRoleArn, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref SubmitFeedbackLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref FeedbacksTable
      Policies:
        - Statement:
            - Sid: PutFeedbacks
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FeedbacksTable.Arn
            - Sid: UseFeedbackKeyThroughDynamoDB
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt FeedbackKey.Arn
              Condition:
                StringEquals:
                  kms:ViaService: !Sub dynamodb.${AWS::Region}.amazonaws.com
      Events:
        SubmitFeedback:
          Type: Api
          Properties:
            RestApiId: !Ref FeedbackApi
            Path: /avaliacao
            Method: POST
            RequestModel:
              Model: SubmitFeedbackRequest
              Required: true
              ValidateBody: true

  CriticalFeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-critical-feedback
      KmsMasterKeyId: !Ref FeedbackKey
      Tags:
        - Key: Project
          Value: schoolapi

  CriticalFeedbackAdminSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CriticalFeedbackTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  NotifyCriticalFeedbackDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-notify-critical-feedback-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: schoolapi

  NotifyCriticalFeedbackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-notify-critical-feedback
      RetentionInDays: 14
      KmsKeyId: !GetAtt FeedbackKey.Arn
      Tags:
        - Key: Project
          Value: schoolapi

  NotifyCriticalFeedbackFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: True
    Properties:
      FunctionName: !Sub ${AWS::StackName}-notify-critical-feedback
      Description: Emails the admins when a critical feedback is stored (DynamoDB stream, filtered).
      CodeUri: ../functions/notify-critical-feedback/target/notify-critical-feedback-1.0.0-SNAPSHOT.jar
      Handler: com.vitorbetmann.schoolapi.infrastructure.NotifyCriticalFeedbackHandler::handleRequest
      Role: !If [UseLabRole, !Ref LambdaRoleArn, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref NotifyCriticalFeedbackLogGroup
      Environment:
        Variables:
          TOPIC_ARN: !Ref CriticalFeedbackTopic
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CriticalFeedbackTopic.TopicName
        - Statement:
            - Sid: UseFeedbackKeyThroughDynamoDBAndSns
              Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !GetAtt FeedbackKey.Arn
              Condition:
                StringEquals:
                  kms:ViaService:
                    - !Sub dynamodb.${AWS::Region}.amazonaws.com
                    - !Sub sns.${AWS::Region}.amazonaws.com
      Events:
        CriticalFeedbackInserted:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt FeedbacksTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 3
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"], "dynamodb": {"NewImage": {"urgency": {"S": ["CRITICAL"]}}}}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt NotifyCriticalFeedbackDlq.Arn

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-reports-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt FeedbackKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: schoolapi

  ReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReportsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ReportsBucket.Arn
              - !Sub ${ReportsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  WeeklyReportTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-weekly-report
      KmsMasterKeyId: !Ref FeedbackKey
      Tags:
        - Key: Project
          Value: schoolapi

  WeeklyReportAdminSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref WeeklyReportTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  CriticalFeedbackTopicTlsOnlyPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CriticalFeedbackTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sns:Publish
            Resource: !Ref CriticalFeedbackTopic
            Condition:
              Bool:
                aws:SecureTransport: "false"

  WeeklyReportTopicTlsOnlyPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref WeeklyReportTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sns:Publish
            Resource: !Ref WeeklyReportTopic
            Condition:
              Bool:
                aws:SecureTransport: "false"

  WeeklyReportScheduleRole:
    Type: AWS::IAM::Role
    Condition: CreateRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeGenerateWeeklyReport
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt GenerateWeeklyReportFunction.Arn
      Tags:
        - Key: Project
          Value: schoolapi

  GenerateWeeklyReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-generate-weekly-report
      RetentionInDays: 14
      KmsKeyId: !GetAtt FeedbackKey.Arn
      Tags:
        - Key: Project
          Value: schoolapi

  GenerateWeeklyReportFunction:
    Type: AWS::Serverless::Function
    Metadata:
      SkipBuild: True
    Properties:
      FunctionName: !Sub ${AWS::StackName}-generate-weekly-report
      Description: Aggregates the last 7 days of feedback, stores the report in S3 and emails a summary.
      CodeUri: ../functions/generate-weekly-report/target/generate-weekly-report-1.0.0-SNAPSHOT.jar
      Handler: com.vitorbetmann.schoolapi.infrastructure.GenerateWeeklyReportHandler::handleRequest
      Role: !If [UseLabRole, !Ref LambdaRoleArn, !Ref AWS::NoValue]
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref GenerateWeeklyReportLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref FeedbacksTable
          BUCKET_NAME: !Ref ReportsBucket
          TOPIC_ARN: !Ref WeeklyReportTopic
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt WeeklyReportTopic.TopicName
        - Statement:
            - Sid: QueryFeedbacksByDay
              Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${FeedbacksTable.Arn}/index/by-day
            - Sid: WriteWeeklyReports
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${ReportsBucket.Arn}/reports/*
            - Sid: UseFeedbackKeyThroughDynamoDBS3AndSns
              Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !GetAtt FeedbackKey.Arn
              Condition:
                StringEquals:
                  kms:ViaService:
                    - !Sub dynamodb.${AWS::Region}.amazonaws.com
                    - !Sub s3.${AWS::Region}.amazonaws.com
                    - !Sub sns.${AWS::Region}.amazonaws.com
      Events:
        WeeklySchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub ${AWS::StackName}-weekly-report
            Description: Every Monday at 08:00 Sao Paulo time, report the previous Monday-Sunday.
            ScheduleExpression: cron(0 8 ? * MON *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: "{}"
            RoleArn: !If [UseLabRole, !Ref LambdaRoleArn, !GetAtt WeeklyReportScheduleRole.Arn]
            RetryPolicy:
              MaximumRetryAttempts: 2

  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-ops-alerts
      KmsMasterKeyId: !Ref FeedbackKey
      Tags:
        - Key: Project
          Value: schoolapi

  OpsAlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref OpsAlertsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowStackAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OpsAlertsTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: sns:Publish
            Resource: !Ref OpsAlertsTopic
            Condition:
              Bool:
                aws:SecureTransport: "false"

  OpsAlertsAdminSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OpsAlertsTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  SubmitFeedbackErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-submit-feedback-errors
      AlarmDescription: submit-feedback function failed at least once in 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SubmitFeedbackFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic
      OKActions:
        - !Ref OpsAlertsTopic
      Tags:
        - Key: Project
          Value: schoolapi

  NotifyCriticalFeedbackErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-notify-critical-feedback-errors
      AlarmDescription: notify-critical-feedback function failed at least once in 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotifyCriticalFeedbackFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic
      OKActions:
        - !Ref OpsAlertsTopic
      Tags:
        - Key: Project
          Value: schoolapi

  GenerateWeeklyReportErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-generate-weekly-report-errors
      AlarmDescription: generate-weekly-report function failed at least once in 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GenerateWeeklyReportFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic
      OKActions:
        - !Ref OpsAlertsTopic
      Tags:
        - Key: Project
          Value: schoolapi

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-5xx
      AlarmDescription: POST /avaliacao returned a 5XX at least once in 5 minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub ${AWS::StackName}-api
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic
      OKActions:
        - !Ref OpsAlertsTopic
      Tags:
        - Key: Project
          Value: schoolapi

  NotifyCriticalFeedbackDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-notify-critical-feedback-dlq
      AlarmDescription: A critical-feedback notice gave up after retries and is waiting in the DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotifyCriticalFeedbackDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic
      OKActions:
        - !Ref OpsAlertsTopic
      Tags:
        - Key: Project
          Value: schoolapi

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-operations
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {"type": "metric", "x": 0, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "Lambda invocations", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${SubmitFeedbackFunction}", {"label": "submit-feedback"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${NotifyCriticalFeedbackFunction}", {"label": "notify-critical-feedback"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${GenerateWeeklyReportFunction}", {"label": "generate-weekly-report"}]
                ]}},
              {"type": "metric", "x": 8, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "Lambda errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${SubmitFeedbackFunction}", {"label": "submit-feedback"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${NotifyCriticalFeedbackFunction}", {"label": "notify-critical-feedback"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${GenerateWeeklyReportFunction}", {"label": "generate-weekly-report"}]
                ]}},
              {"type": "metric", "x": 16, "y": 0, "width": 8, "height": 6, "properties": {
                "title": "Lambda duration (ms, average)", "region": "${AWS::Region}", "stat": "Average", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${SubmitFeedbackFunction}", {"label": "submit-feedback"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${NotifyCriticalFeedbackFunction}", {"label": "notify-critical-feedback"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "${GenerateWeeklyReportFunction}", {"label": "generate-weekly-report"}]
                ]}},
              {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "API requests and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${ApiName}", "Stage", "${Stage}", {"label": "requests"}],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${ApiName}", "Stage", "${Stage}", {"label": "4XX"}],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${ApiName}", "Stage", "${Stage}", {"label": "5XX"}]
                ]}},
              {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "Feedbacks received by urgency", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries", "stacked": true,
                "metrics": [
                  ["SchoolAPI", "FeedbackReceived", "urgency", "CRITICAL", {"label": "CRITICAL"}],
                  ["SchoolAPI", "FeedbackReceived", "urgency", "MEDIUM", {"label": "MEDIUM"}],
                  ["SchoolAPI", "FeedbackReceived", "urgency", "LOW", {"label": "LOW"}]
                ]}},
              {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {
                "title": "Notices sent, reports generated, DLQ depth", "region": "${AWS::Region}", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["SchoolAPI", "NotificationSent", "Service", "schoolapi", {"stat": "Sum", "label": "critical notices sent"}],
                  ["SchoolAPI", "ReportGenerated", "Service", "schoolapi", {"stat": "Sum", "label": "weekly reports generated"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${DlqName}", {"stat": "Maximum", "label": "DLQ messages"}]
                ]}},
              {"type": "alarm", "x": 0, "y": 12, "width": 24, "height": 3, "properties": {
                "title": "Alarms",
                "alarms": ["${SubmitFeedbackErrorsAlarm.Arn}", "${NotifyCriticalFeedbackErrorsAlarm.Arn}", "${GenerateWeeklyReportErrorsAlarm.Arn}", "${Api5xxAlarm.Arn}", "${NotifyCriticalFeedbackDlqAlarm.Arn}"]
                }}
            ]
          }
        - ApiName: !Sub ${AWS::StackName}-api
          DlqName: !GetAtt NotifyCriticalFeedbackDlq.QueueName

  AuditTrailBucket:
    Type: AWS::S3::Bucket
    Condition: CreateRoles
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AWS::StackName}-audit-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: schoolapi

  AuditTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateRoles
    Properties:
      Bucket: !Ref AuditTrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditTrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-audit
          - Sid: AllowCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${AuditTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-audit
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AuditTrailBucket.Arn
              - !Sub ${AuditTrailBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AuditTrail:
    Type: AWS::CloudTrail::Trail
    Condition: CreateRoles
    DependsOn: AuditTrailBucketPolicy
    Properties:
      TrailName: !Sub ${AWS::StackName}-audit
      S3BucketName: !Ref AuditTrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      Tags:
        - Key: Project
          Value: schoolapi

Outputs:
  ApiUrl:
    Description: POST endpoint for course feedback.
    Value: !Sub https://${FeedbackApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/avaliacao
  ApiKeyId:
    Description: API key id (get the value with aws apigateway get-api-key --include-value).
    Value: !Ref FeedbackApiApiKey
  CriticalFeedbackTopicArn:
    Description: SNS topic for critical-feedback notices.
    Value: !Ref CriticalFeedbackTopic
  FeedbacksTableName:
    Description: DynamoDB table holding the feedbacks.
    Value: !Ref FeedbacksTable
  ReportsBucketName:
    Description: Private S3 bucket holding the weekly reports (reports/YYYY/Www.json).
    Value: !Ref ReportsBucket
  WeeklyReportTopicArn:
    Description: SNS topic for the weekly report summary.
    Value: !Ref WeeklyReportTopic
  GenerateWeeklyReportFunctionName:
    Description: Function to invoke for an on-demand report (scripts/invoke-report.sh).
    Value: !Ref GenerateWeeklyReportFunction
  OpsAlertsTopicArn:
    Description: SNS topic for CloudWatch alarm notifications.
    Value: !Ref OpsAlertsTopic
  DashboardUrl:
    Description: CloudWatch operations dashboard.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${OperationsDashboard}
  AuditTrailBucketName:
    Condition: CreateRoles
    Description: S3 bucket holding the CloudTrail management-event logs (retained if the stack is deleted).
    Value: !Ref AuditTrailBucket

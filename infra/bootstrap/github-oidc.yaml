AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SchoolAPI continuous deployment. GitHub Actions OIDC provider, a deploy role that only the
  repository's protected "prod" environment can assume, and the CloudFormation execution role that actually changes
  the app stack's resources. Deployed once by an administrator.

Parameters:
  GitHubOwner:
    Type: String
    AllowedPattern: "[A-Za-z0-9-]+"
    Description: GitHub user or organization that owns the repository.
  GitHubOwnerId:
    Type: String
    AllowedPattern: "[0-9]+"
    Description: Numeric id of the owner (gh api repos/OWNER/REPO --jq .owner.id).
  GitHubRepo:
    Type: String
    AllowedPattern: "[A-Za-z0-9._-]+"
    Description: Repository name.
  GitHubRepoId:
    Type: String
    AllowedPattern: "[0-9]+"
    Description: Numeric id of the repository (gh api repos/OWNER/REPO --jq .id). GitHub's immutable OIDC subject includes it.
  GitHubEnvironment:
    Type: String
    Default: prod
    Description: GitHub environment the deploy job runs in (its protection rules gate every deploy).
  AppStackName:
    Type: String
    Default: schoolapi
    Description: Stack the pipeline deploys.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: schoolapi

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cfn-exec-${AppStackName}
      Description: Used by CloudFormation (never by people or the pipeline directly) to change the app stack.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: ManageAppStackRoles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:*
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*
      Tags:
        - Key: Project
          Value: schoolapi

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub github-deploy-${AppStackName}
      Description: Assumed by GitHub Actions (OIDC) to run sam deploy for the app stack.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: DeployAppStackThroughCloudFormation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageAppStackChangeSets
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: FindSamArtifactBucket
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - Sid: ReadTemplatesWithoutResourceLevelSupport
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: UploadSamArtifacts
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*
                  - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*
              - Sid: HandStackChangesToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
      Tags:
        - Key: Project
          Value: schoolapi

Outputs:
  GitHubDeployRoleArn:
    Description: Repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Description: Repository variable AWS_CFN_EXEC_ROLE_ARN.
    Value: !GetAtt CloudFormationExecutionRole.Arn
